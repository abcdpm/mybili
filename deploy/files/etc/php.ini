
[php]
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 1024M
# for product
display_errors=off
log_errors=on
error_log=/tmp/php-error.log

allow_url_fopen=1

# 【内存治理】opcache（仅影响 frankenphp Web 运行时；CLI 队列 worker 不加载 opcache）：
# 默认 opcache.memory_consumption=128MB 偏大，Laravel 优化后类图 64MB 足够，
# 触碰页计入容器内存，收紧后 Web 进程 RSS 可降 30-60MB
[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000

[date]
date.timezone=PRC

